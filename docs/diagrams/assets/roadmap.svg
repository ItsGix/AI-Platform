<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="934" viewBox="0 0 1120 934" role="img" aria-labelledby="title desc">
<title id="title">Learning roadmap</title><desc id="desc">Git and Python are active learning. Five of fifteen beginner Python chapters are complete. Linux, Docker, Terraform, Ansible, Kubernetes, AI tooling, CI/CD and cloud remain learning goals.</desc>
<rect width="1120" height="934" rx="20" fill="#0b1220"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="36" y="43" fill="#67d9ef" font-size="16" font-weight="700">02 / LEARNING ROADMAP</text><text x="36" y="83" fill="#eef5ff" font-size="31" font-weight="700">Build foundations. Apply them to the platform.</text><text x="36" y="115" fill="#b8c9de" font-size="19" font-weight="400">Learning sequence, not a completed technology stack</text><rect x="32" y="144" width="1056" height="128" rx="14" fill="#142136" stroke="#2c405b"/><text x="54" y="189" fill="#67d9ef" font-size="27" font-weight="700">01</text><text x="111" y="186" fill="#eef5ff" font-size="25" font-weight="700">Foundations</text><text x="111" y="222" fill="#67d9ef" font-size="14" font-weight="700">ACTIVE LEARNING</text><text x="475" y="176" fill="#b8c9de" font-size="18" font-weight="400">Git &amp; GitHub · Python</text><text x="475" y="206" fill="#b8c9de" font-size="18" font-weight="400">5 / 15 beginner chapters complete</text><text x="475" y="236" fill="#b8c9de" font-size="18" font-weight="400">Original infrastructure exercises</text><rect x="32" y="290" width="1056" height="128" rx="14" fill="#142136" stroke="#2c405b"/><text x="54" y="335" fill="#ffd18a" font-size="27" font-weight="700">02</text><text x="111" y="332" fill="#eef5ff" font-size="25" font-weight="700">Systems</text><text x="111" y="368" fill="#ffd18a" font-size="14" font-weight="700">LEARNING GOALS</text><text x="475" y="322" fill="#b8c9de" font-size="18" font-weight="400">Linux · Docker</text><text x="475" y="352" fill="#b8c9de" font-size="18" font-weight="400">Services, networking and containers</text><text x="475" y="382" fill="#b8c9de" font-size="18" font-weight="400">Core checklist items remain open</text><rect x="32" y="436" width="1056" height="128" rx="14" fill="#142136" stroke="#2c405b"/><text x="54" y="481" fill="#ffd18a" font-size="27" font-weight="700">03</text><text x="111" y="478" fill="#eef5ff" font-size="25" font-weight="700">Automation</text><text x="111" y="514" fill="#ffd18a" font-size="14" font-weight="700">PLANNED</text><text x="475" y="468" fill="#b8c9de" font-size="18" font-weight="400">Terraform · Ansible</text><text x="475" y="498" fill="#b8c9de" font-size="18" font-weight="400">Provision and configure the lab</text><text x="475" y="528" fill="#b8c9de" font-size="18" font-weight="400">Implementation directories scaffolded</text><rect x="32" y="582" width="1056" height="128" rx="14" fill="#142136" stroke="#2c405b"/><text x="54" y="627" fill="#ffd18a" font-size="27" font-weight="700">04</text><text x="111" y="624" fill="#eef5ff" font-size="25" font-weight="700">Platform &amp; AI</text><text x="111" y="660" fill="#ffd18a" font-size="14" font-weight="700">LEARNING GOALS</text><text x="475" y="614" fill="#b8c9de" font-size="18" font-weight="400">Kubernetes · Model APIs</text><text x="475" y="644" fill="#b8c9de" font-size="18" font-weight="400">Existing K3s lab, fundamentals ahead</text><text x="475" y="674" fill="#b8c9de" font-size="18" font-weight="400">Serving, GPU workloads and tooling</text><rect x="32" y="728" width="1056" height="128" rx="14" fill="#142136" stroke="#2c405b"/><text x="54" y="773" fill="#ffd18a" font-size="27" font-weight="700">05</text><text x="111" y="770" fill="#eef5ff" font-size="25" font-weight="700">Delivery &amp; cloud</text><text x="111" y="806" fill="#ffd18a" font-size="14" font-weight="700">PLANNED</text><text x="475" y="760" fill="#b8c9de" font-size="18" font-weight="400">CI/CD · GitOps concepts</text><text x="475" y="790" fill="#b8c9de" font-size="18" font-weight="400">Cloud platform to be selected</text><text x="475" y="820" fill="#b8c9de" font-size="18" font-weight="400">Azure or AWS under consideration</text><text x="36" y="906" fill="#b8c9de" font-size="18" font-weight="400">Checklist status is preserved. Running infrastructure does not imply skill mastery.</text></g></svg>
