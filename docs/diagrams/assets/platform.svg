<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc">
<title id="title">Proxmox and K3s hosting topology</title><desc id="desc">Compute host contains a K3s control plane, two workers and intended GPU VM. A separate storage host serves network shares. No high availability or Kubernetes storage integration is claimed.</desc>
<rect width="1120" height="780" rx="20" fill="#0b1220"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="36" y="42" fill="#67d9ef" font-size="16" font-weight="700">01 / PLATFORM TOPOLOGY</text><text x="36" y="81" fill="#eef5ff" font-size="32" font-weight="700">Virtualised compute. Dedicated inference.</text><text x="36" y="111" fill="#b8c9de" font-size="18" font-weight="400">Existing Proxmox / K3s baseline with intended GPU VM placement</text><rect x="32" y="140" width="1056" height="449" rx="14" fill="#142136" stroke="#2c405b"/><text x="56" y="176" fill="#67d9ef" font-size="20" font-weight="700">PROXMOX HOST 1 · COMPUTE</text><text x="56" y="204" fill="#b8c9de" font-size="17" font-weight="400">16 cores / 32 threads  ·  128 GB RAM  ·  2 TB NVMe</text><rect x="54" y="227" width="628" height="266" rx="14" fill="#0b1220" stroke="#2c405b"/><text x="76" y="260" fill="#eef5ff" font-size="20" font-weight="700">K3s cluster / existing VM topology</text><rect x="214" y="279" width="310" height="58" rx="14" fill="#142136" stroke="#2c405b"/><text x="252" y="315" fill="#85e4b5" font-size="21" font-weight="700">k3s-control</text><path d="M369 337v24H214v25M369 361h155v25" stroke="#85e4b5" fill="none" stroke-width="2"/><rect x="76" y="389" width="272" height="72" rx="14" fill="#142136" stroke="#2c405b"/><text x="98" y="432" fill="#85e4b5" font-size="20" font-weight="700">k3s-worker-1</text><rect x="386" y="389" width="272" height="72" rx="14" fill="#142136" stroke="#2c405b"/><text x="408" y="432" fill="#85e4b5" font-size="20" font-weight="700">k3s-worker-2</text><rect x="704" y="227" width="362" height="266" rx="14" fill="#0b1220" stroke="#806444"/><text x="726" y="260" fill="#ffd18a" font-size="20" font-weight="700">GPU backend / intended VM</text><text x="726" y="302" fill="#eef5ff" font-size="19" font-weight="400">llama.cpp inference server</text><text x="726" y="339" fill="#b8c9de" font-size="17" font-weight="400">PCIe passthrough</text><rect x="726" y="365" width="318" height="62" rx="14" fill="#142136" stroke="#2c405b"/><text x="744" y="403" fill="#ffd18a" font-size="20" font-weight="700">RTX 3060 · 12 GB VRAM</text><text x="726" y="465" fill="#b8c9de" font-size="17" font-weight="400">Outside the K3s worker pool</text><text x="56" y="535" fill="#b8c9de" font-size="19" font-weight="400">Other homelab services remain outside the AI migration scope.</text><text x="56" y="564" fill="#ffd18a" font-size="17" font-weight="400">One physical compute host; no high-availability claim.</text><rect x="32" y="609" width="1056" height="110" rx="14" fill="#142136" stroke="#2c405b"/><text x="56" y="644" fill="#67d9ef" font-size="20" font-weight="700">PROXMOX HOST 2 · INDEPENDENT STORAGE</text><text x="56" y="677" fill="#b8c9de" font-size="19" font-weight="400">Network shares  ·  2 × 8 TB disks  ·  K3s storage integration unspecified</text><text x="36" y="752" fill="#b8c9de" font-size="17" font-weight="400">Hosting boundaries only. Runtime placement and connectivity are not live-verified.</text></g></svg>
